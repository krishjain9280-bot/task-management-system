<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in · TaskFlow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-brand">
      <span class="brand-mark">TF</span>
      <span class="brand-name">TaskFlow</span>
    </div>
    <h2 class="auth-title">Welcome back</h2>
    <p class="auth-sub">Log in to keep track of your team's work.</p>

    <form id="loginForm" novalidate>
      <div class="form-group">
        <label class="form-label" for="username">Username or email</label>
        <input class="form-input" type="text" id="username" name="username" autocomplete="username" placeholder="jane.doe">
        <span class="form-error" id="err-username"></span>
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input class="form-input" type="password" id="password" name="password" autocomplete="current-password" placeholder="••••••••">
        <span class="form-error" id="err-password"></span>
      </div>
      <button class="btn btn-primary btn-block" type="submit" id="loginSubmit">
        <span id="loginSubmitText">Log in</span>
      </button>
    </form>

    <p class="auth-footer">Don't have an account? <a href="{{ url_for('pages.signup_page') }}">Sign up</a></p>
  </div>
</div>

<div id="toastHost" class="toast-host" aria-live="polite"></div>
<script src="{{ url_for('static', filename='js/theme.js') }}"></script>
<script src="{{ url_for('static', filename='js/common.js') }}"></script>
<script src="{{ url_for('static', filename='js/auth.js') }}"></script>
</body>
</html>
