{% extends "base.html" %}
{% block title %}New Task · TaskFlow{% endblock %}
{% block page_title %}Create Task{% endblock %}

{% block content %}
<div class="card section-card" style="max-width:640px;">
  <form id="createTaskForm" novalidate>
    <div class="form-group">
      <label class="form-label" for="title">Title</label>
      <input class="form-input" type="text" id="title" name="title" placeholder="e.g. Set up staging environment">
      <span class="form-error" id="err-title"></span>
    </div>

    <div class="form-group">
      <label class="form-label" for="description">Description</label>
      <textarea class="form-textarea" id="description" name="description" placeholder="Add any helpful details about this task..."></textarea>
      <span class="form-error" id="err-description"></span>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label class="form-label" for="owner_name">Owner</label>
        <input class="form-input" type="text" id="owner_name" name="owner_name" placeholder="Who is responsible?">
        <span class="form-error" id="err-owner_name"></span>
      </div>
      <div class="form-group">
        <label class="form-label" for="status">Status</label>
        <select class="form-select" id="status" name="status">
          <option value="Open">Open</option>
          <option value="In Progress">In Progress</option>
          <option value="Completed">Completed</option>
        </select>
      </div>
    </div>

    <div style="display:flex; gap:10px; margin-top:6px;">
      <button type="submit" class="btn btn-primary" id="createSubmit">
        <span id="createSubmitText">Create Task</span>
      </button>
      <a href="{{ url_for('pages.tasks_page') }}" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}

{% block extra_scripts %}
<script src="{{ url_for('static', filename='js/task_create.js') }}"></script>
{% endblock %}
